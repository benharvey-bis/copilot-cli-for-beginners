repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
        files: ^samples/book-app-project/.*\.py$
      - id: ruff-format
        files: ^samples/book-app-project/.*\.py$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest samples/book-app-project/tests -q
        language: system
        pass_filenames: false
